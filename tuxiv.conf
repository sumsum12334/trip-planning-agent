entrypoint:
  - bash ${TACC_WORKDIR}/job.sh
environment:
  name: mpi-gemm-v1
  channels:
    - nodefaults
  dependencies:
    - "{}"
job:
  name: trip-planning-agent
  general:
    - partition=tacc
    - nodes=1
    - ntasks=1
    - cpus-per-task=2
    - time=01:00:00
    - output=${TACC_SLURM_USERLOG}/trip-planning-agent-%j.log
