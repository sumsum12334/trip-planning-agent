[project]
name = "trip-planning-agent"
version = "0.1.0"
description = "CSIT6000V multi-agent trip planning agent (basic config scaffold)"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "fastapi>=0.115.0,<1.0",
  "uvicorn[standard]>=0.32.0,<1.0",
  "pydantic>=2.9.0,<3.0",
  "pydantic-settings>=2.5.0,<3.0",
  "httpx>=0.27.0,<1.0",
  "python-dotenv>=1.0.0,<2.0",
  "langgraph>=0.2.0,<1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0,<9.0"]
langfuse = ["langfuse>=2.57.0,<3.0"]
db = ["sqlalchemy>=2.0.36,<3.0", "psycopg[binary]>=3.2.0,<4.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["trip_planning_agent*", "agents*", "backend*", "config*", "shared*", "eval*"]
